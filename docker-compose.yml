# OBS Logic Block — Development Stack
#
# Quick start:
#   cp .env.example .env
#   docker compose up
#
# Edit plugin.py and save — OBS reloads it automatically (no restart needed).
# Admin UI:  http://localhost:8080   (admin / admin)

services:

  # ── MQTT Broker ────────────────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    user: root
    command: >
      sh -c "
      mkdir -p /mosquitto/passwd &&
      chmod 777 /mosquitto/passwd &&
      rm -f /mosquitto/passwd/passwd &&
      mosquitto_passwd -c -b /mosquitto/passwd/passwd $$MQTT_SVC_USER $$MQTT_SVC_PASS &&
      chmod 644 /mosquitto/passwd/passwd &&
      exec mosquitto -c /mosquitto/config/mosquitto.conf
      "
    environment:
      MQTT_SVC_USER: ${OBS_MQTT_USERNAME:-obs}
      MQTT_SVC_PASS: ${OBS_MQTT_PASSWORD:-changeme}
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_passwd:/mosquitto/passwd
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck",
             "-u", "${OBS_MQTT_USERNAME:-obs}", "-P", "${OBS_MQTT_PASSWORD:-changeme}", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── open bridge server ────────────────────────────────────────────────────
  obs:
    image: ghcr.io/starwarsfan/openbridgeserver:2026.7.0-RC3
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    volumes:
      - obs_data:/data
      - mosquitto_passwd:/mosquitto/passwd
      # ↓ Your plugin file — edit and save, OBS reloads automatically
      - ./plugin.py:/plugins/plugin.py:ro
    ports:
      - "${OBS_HTTP_HOST_PORT:-8080}:8080"
    environment:
      OBS_MQTT__HOST: mosquitto
      OBS_MQTT__PORT: "1883"
      OBS_MQTT__USERNAME: ${OBS_MQTT_USERNAME:-obs}
      OBS_MQTT__PASSWORD: ${OBS_MQTT_PASSWORD:-changeme}
      OBS_MOSQUITTO__PASSWD_FILE: /mosquitto/passwd/passwd
      OBS_MOSQUITTO__SERVICE_USERNAME: ${OBS_MQTT_USERNAME:-obs}
      OBS_MOSQUITTO__SERVICE_PASSWORD: ${OBS_MQTT_PASSWORD:-changeme}
      # Dev env: omit RELOAD_PID / RELOAD_COMMAND so OBS uses its null defaults (no runtime reload needed)
      OBS_SECURITY__JWT_SECRET: ${OBS_JWT_SECRET:-dev-secret-change-in-production}
      OBS_SERVER__LOG_LEVEL: ${OBS_LOG_LEVEL:-INFO}
      # Tells OBS to watch this directory for plugin files
      OBS_PLUGINS_DIR: /plugins

volumes:
  obs_data:
  mosquitto_passwd:
  mosquitto_data:
